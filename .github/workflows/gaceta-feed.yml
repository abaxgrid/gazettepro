name: Gaceta Oficial feed

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás"
        default: "30"
      year:
        description: "Año para recalcular faltantes (opcional)"
        default: ""

permissions:
  contents: write

concurrency:
  group: gaceta-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer el portal oficial
        env:
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            python scripts/gaceta_feed.py --year "${{ github.event.inputs.year }}"
          else
            python scripts/gaceta_feed.py
          fi
      - name: Guardar cambios
        run: |
          if git diff --quiet data/gacetas.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "gazettepro-bot"
          git config user.email "gazettepro-bot@users.noreply.github.com"
          git add data/gacetas.json
          git commit -m "Actualiza Gacetas desde el portal oficial"
          git push
